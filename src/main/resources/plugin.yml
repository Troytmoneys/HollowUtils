name: HollowUtils
version: 1.0.0
main: io.github.troytmoneys.hollowutils.HollowUtils
api-version: '1.21.11'
depend: [Multiverse-Core, Multiverse-Inventories]
softdepend: [Essentials, CMI]
description: Isolated logical survival servers with linked dimensions.
commands:
  server:
    description: Open the server menu or join a server
    usage: /server [name] [player]
    permission: hollowutils.use
  createserver:
    description: Create an isolated full, normal or superflat server
    usage: /createserver <name> [full|normal|flat] [seed]
    permission: hollowutils.admin
  backupserver:
    description: Back up the selected server world directories
    usage: /backupserver <name>
    permission: hollowutils.admin
  whitelistserver:
    description: Manage a server whitelist
    usage: /whitelistserver <name> <on|off|add|remove|list> [online-player-or-UUID]
    permission: hollowutils.admin
  deleteserver:
    description: Back up then delete an empty server and all its dimensions
    usage: /deleteserver <name> [confirm]
    permission: hollowutils.admin
  maintenanceserver:
    description: Toggle maintenance for a server
    usage: /maintenanceserver <name> <on|off>
    permission: hollowutils.admin
  spawn:
    description: Teleport to this server's spawn
    usage: /spawn [player]
    permission: hollowutils.use
  setspawn:
    description: Set this server's spawn at your position or a target player's position
    usage: /setspawn [player]
    permission: hollowutils.admin
  gmc:
    description: Change gamemode for yourself or another player
    usage: /gmc [player]
    permission: hollowutils.gamemode
  gms:
    description: Change gamemode for yourself or another player
    usage: /gms [player]
    permission: hollowutils.gamemode
  gmsp:
    description: Change gamemode for yourself or another player
    usage: /gmsp [player]
    permission: hollowutils.gamemode
  gma:
    description: Change gamemode for yourself or another player
    usage: /gma [player]
    permission: hollowutils.gamemode
  gamemode:
    description: Change gamemode for yourself or another player
    usage: /gamemode <survival|creative|adventure|spectator> [player]
    permission: hollowutils.gamemode
  gm:
    description: Change gamemode for yourself or another player
    usage: /gm <survival|creative|adventure|spectator> [player]
    permission: hollowutils.gamemode
  heal:
    description: Restore health and hunger and extinguish fire
    usage: /heal [player]
    permission: hollowutils.heal
  back:
    description: HollowUtils back
    usage: /back
    permission: hollowutils.back
  backup:
    description: HollowUtils backup
    usage: /backup [server] [local|drive|both]
    permission: hollowutils.backup
  bottom:
    description: HollowUtils bottom
    usage: /bottom [player]
    permission: hollowutils.bottom
  bc:
    description: HollowUtils broadcast
    usage: /bc <message>
    permission: hollowutils.broadcast
  broadcast:
    description: HollowUtils broadcast
    usage: /broadcast <message>
    permission: hollowutils.broadcast
  ci:
    description: HollowUtils clear
    usage: /ci [player]
    permission: hollowutils.clear
  clearinventory:
    description: HollowUtils clear
    usage: /clearinventory [player]
    permission: hollowutils.clear
  clear:
    description: HollowUtils clear
    usage: /clear [player]
    permission: hollowutils.clear
  createkit:
    description: HollowUtils createkit
    usage: /createkit <name> [INVENTORY|GUI]
    permission: hollowutils.createkit
  kit:
    description: HollowUtils kit
    usage: /kit [name] [player]
    permission: hollowutils.kit
  deletekit:
    description: HollowUtils deletekit
    usage: /deletekit <name>
    permission: hollowutils.deletekit
  ban:
    description: Server-scoped moderation - ban
    usage: /ban <player|uuid> <duration|infinite> <reason>
    permission: hollowutils.ban
  banip:
    description: Server-scoped moderation - banip
    usage: /banip <player|ip> [reason]
    permission: hollowutils.banip
  unban:
    description: Server-scoped moderation - unban
    usage: /unban <player|uuid>
    permission: hollowutils.unban
  unbanip:
    description: Server-scoped moderation - unbanip
    usage: /unbanip <player|ip>
    permission: hollowutils.unbanip
  staffrollback:
    description: Server-scoped moderation - staffrollback
    usage: /staffrollback <staff|uuid|CONSOLE> [confirm]
    permission: hollowutils.staffrollback
  kick:
    description: Server-scoped moderation - kick
    usage: /kick <player> [reason]
    permission: hollowutils.kick
  mute:
    description: Server-scoped moderation - mute
    usage: /mute <player|uuid> <duration|infinite> <reason>
    permission: hollowutils.mute
  unmute:
    description: Server-scoped moderation - unmute
    usage: /unmute <player|uuid>
    permission: hollowutils.unmute
  warn:
    description: Server-scoped moderation - warn
    usage: /warn <player|uuid> [reason]
    permission: hollowutils.warn
  unwarn:
    description: Server-scoped moderation - unwarn
    usage: /unwarn <player|uuid> <id|all>
    permission: hollowutils.unwarn
  warns:
    description: Server-scoped moderation - warns
    usage: /warns <player|uuid> [page]
    permission: hollowutils.warns
  punishments:
    description: Server-scoped moderation - punishments
    usage: /punishments <player|uuid> [page]
    permission: hollowutils.punishments
  history:
    description: Server-scoped moderation - history
    usage: /history <player|uuid|ip> [page]
    permission: hollowutils.history
  createwarp:
    description: Server-local warps - createwarp
    usage: /createwarp <name>
    permission: hollowutils.createwarp
  warp:
    description: Server-local warps - warp
    usage: /warp [name]
    permission: hollowutils.warp
  deletewarp:
    description: Server-local warps - deletewarp
    usage: /deletewarp <name>
    permission: hollowutils.deletewarp
  warpgui:
    description: Server-local warps - warpgui
    usage: /warpgui
    permission: hollowutils.warpgui
  createhome:
    description: HollowUtils createhome
    usage: /createhome <name>
    permission: hollowutils.createhome
  deletehome:
    description: HollowUtils deletehome
    usage: /deletehome <name>
    permission: hollowutils.deletehome
  home:
    description: HollowUtils home
    usage: /home [name]
    permission: hollowutils.home
  homegui:
    description: HollowUtils homegui
    usage: /homegui
    permission: hollowutils.homegui
  msg:
    description: HollowUtils msg
    usage: /msg <player> <message>
    permission: hollowutils.msg
  pm:
    description: HollowUtils msg
    usage: /pm <player> <message>
    permission: hollowutils.msg
  message:
    description: HollowUtils msg
    usage: /message <player> <message>
    permission: hollowutils.msg
  whisper:
    description: HollowUtils msg
    usage: /whisper <player> <message>
    permission: hollowutils.msg
  privatemanager:
    description: HollowUtils msg
    usage: /privatemanager <player> <message>
    permission: hollowutils.msg
  socialspy:
    description: HollowUtils socialspy
    usage: /socialspy [on|off]
    permission: hollowutils.socialspy
  fly:
    description: Server-local fly control
    usage: /fly [on|off] [player]
    permission: hollowutils.fly
  flyspeed:
    description: Server-local flyspeed control
    usage: /flyspeed <0-10|reset> [player]
    permission: hollowutils.flyspeed
  walkspeed:
    description: Server-local walkspeed control
    usage: /walkspeed <0-10|reset> [player]
    permission: hollowutils.walkspeed
  day:
    description: Server-local day control
    usage: /day [server-for-console]
    permission: hollowutils.day
  night:
    description: Server-local night control
    usage: /night [server-for-console]
    permission: hollowutils.night
  sunset:
    description: Server-local sunset control
    usage: /sunset [server-for-console]
    permission: hollowutils.sunset
  sunrise:
    description: Server-local sunrise control
    usage: /sunrise [server-for-console]
    permission: hollowutils.sunrise
  sun:
    description: Server-local sun control
    usage: /sun [server-for-console]
    permission: hollowutils.sun
  rain:
    description: Server-local rain control
    usage: /rain [server-for-console]
    permission: hollowutils.rain
  thunder:
    description: Server-local thunder control
    usage: /thunder [server-for-console]
    permission: hollowutils.thunder
  loadserver:
    description: loadserver all worlds of a logical server without deleting data
    usage: /loadserver <name>
    permission: hollowutils.loadserver
  unloadserver:
    description: unloadserver all worlds of a logical server without deleting data
    usage: /unloadserver <name>
    permission: hollowutils.unloadserver
